name: global_earn
description: "Global Earn - Earn money online with ease"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^14.6.3
  google_fonts: ^6.2.1
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  connectivity_plus: ^7.1.1
  get_it: ^9.2.1
  intl: ^0.19.0
  http: ^1.2.0
  webview_flutter: ^4.10.0
  flutter_image_compress: ^2.4.0
  image_picker: ^1.0.7
  path_provider: ^2.1.5
  path: ^1.9.1
  url_launcher: ^6.3.2
  quick_payment: ^1.4.0
  flutter_animate: ^4.5.0
  flutter_native_splash: ^2.4.0
  font_awesome_flutter: ^10.7.0
  flutter_linkify: ^6.0.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^18.0.1
  package_info_plus: ^9.0.1
  crypto: ^3.0.6
  curved_navigation_bar: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/golden_power_logo2.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/golden_power_logo2.png"


flutter_native_splash:
  color: "#097CCB"
  image: "assets/images/golden_power_logo2.png"
  android_12:
    color: "#097CCB"
    image: "assets/images/golden_power_logo2.png"
